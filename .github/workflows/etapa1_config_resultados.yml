name: Etapa 1 - estrutura do Portal Resultados (so config, sem dados do 2T)
on:
  push:
    branches: [etapa1-pipeline]
    paths: [".github/workflows/etapa1_config_resultados.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Le apenas os arquivos de configuracao (lista de secoes e nomes de arquivo)
        run: |
          mkdir -p out
          S=estudos/03_pianista/etapas/01_coleta/resultados_secoes.py
          python3 $S --uf TO --pleito 3220 --so-config --saida cfg3220 --manifesto out/config_3220_TO.json | tee out/config.txt || true
          python3 $S --uf TO --pleito 3221 --so-config --saida cfg3221 --manifesto out/config_3221_TO.json | tee -a out/config.txt || true
          python3 - <<'PY' | tee out/estrutura_config.txt
          import json, glob, urllib.request
          for f in sorted(glob.glob("cfg*/*.json")):
              d = json.load(open(f))
              mu = d["abr"][0]["mu"][0]; z = mu["zon"][0]
              print(f, "| topo:", {k: d[k] for k in d if k != "abr"})
              print("  abr[0] chaves:", sorted(d["abr"][0].keys()), "| mu chaves:", sorted(mu.keys()), "| zon chaves:", sorted(z.keys()))
              print("  primeiras secoes:", json.dumps(z["sec"][:3], ensure_ascii=False))
          d = json.load(open("cfg3220/to-p003220-cs.json"))
          mu = d["abr"][0]["mu"][0]; z = mu["zon"][0]; s = z["sec"][0]
          base = "https://resultados.tse.jus.br/oficial/ele2026/arquivo-urna/3220/dados/to"
          cand = [f"{base}/{mu['cd']}/{z['cd']}/{s['ns']}/p003220-to-m{mu['cd']}-z{z['cd']}-s{s['ns']}-aux.json"]
          for url in cand:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "opianista"}), timeout=60).read()
                  print("AUX OK", url); print(b.decode("utf-8")[:3000])
              except Exception as e:
                  print("AUX FALHOU", url, e)
          PY
      - name: Publica saidas
        if: always()
        run: |
          mkdir -p pub && cd pub
          git init -q -b saidas-actions
          git config user.name "opianista-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git fetch -q origin saidas-actions && git checkout -q -B saidas-actions FETCH_HEAD || git checkout -q -B saidas-actions
            mkdir -p config_resultados && cp -r ../out/* config_resultados/
            git add -A && git commit -qm "Config Portal Resultados (run ${{ github.run_id }})" || true
            git push -q origin saidas-actions && break
            sleep 7
          done
