name: Sonda TSE
on:
  push:
    branches: [etapa1-pipeline]
    paths: [".github/workflows/sonda_tse.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Consulta a API CKAN do TSE
        run: |
          set -u
          mkdir -p out
          {
          for q in resultados-2026-arquivos-transmitidos-para-totalizacao resultados-2022-arquivos-transmitidos-para-totalizacao resultados-2018-arquivos-transmitidos-para-totalizacao; do
            echo "== $q"
            curl -sS -m 90 "https://dadosabertos.tse.jus.br/api/3/action/package_show?id=$q" -o "$q.json" -w "http=%{http_code}\n" || echo "curl falhou"
            python3 - "$q.json" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print("sem json:", e); sys.exit(0)
          r = d.get("result", {})
          print("titulo:", r.get("title"), "| licenca:", r.get("license_id"), "| modificado:", r.get("metadata_modified"), "| recursos:", len(r.get("resources", [])))
          for x in r.get("resources", []):
              print(" -", x.get("name"), "|", x.get("format"), "|", x.get("size"), "|", x.get("url"))
          PY
          done
          } > out/sonda.txt 2>&1
          cat out/sonda.txt | head -50
      - name: Publica saida na branch saidas-actions
        run: |
          cd out
          git init -q -b saidas-actions
          git config user.name "opianista-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sonda.txt
          git commit -qm "Saida da sonda TSE (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" saidas-actions
