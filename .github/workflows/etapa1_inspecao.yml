name: Etapa 1 - inspecao de logs (TO, 1T 2026 e 2022)
on:
  push:
    branches: [etapa1-pipeline]
    paths: [".github/workflows/etapa1_inspecao.yml", "estudos/03_pianista/etapas/02_parser/logs_urna.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspecao:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q py7zr==1.1.4
      - name: Baixa pacotes de TO (1T 2026; 1T e 2T 2022)
        run: |
          mkdir -p dados out
          for spec in "2026 1t" "2022 1t" "2022 2t"; do
            set -- $spec
            url="https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes$1/arqurnatot/bu_imgbu_logjez_rdv_vscmr_$1_$2_TO.zip"
            curl -sS -m 3000 --retry 3 -o "dados/$1_$2_TO.zip" -w "$1 $2 http=%{http_code} bytes=%{size_download}\n" "$url" | tee -a out/downloads.txt
            sha256sum "dados/$1_$2_TO.zip" | tee -a out/downloads.txt
            python3 -c "import zipfile,sys,collections;z=zipfile.ZipFile(sys.argv[1]);c=collections.Counter(n.rsplit('.',1)[-1] for n in z.namelist());print(sys.argv[1],dict(c))" "dados/$1_$2_TO.zip" | tee -a out/downloads.txt
          done
      - name: Catalogo e amostra
        run: |
          P=estudos/03_pianista/etapas/02_parser/logs_urna.py
          python3 $P catalogo --zip dados/2026_1t_TO.zip --data 2026-10-04 --saida out/catalogo_2026_1t_TO.csv | tee out/resumo_catalogo.txt
          python3 $P catalogo --zip dados/2022_1t_TO.zip --data 2022-10-02 --saida out/catalogo_2022_1t_TO.csv | tee -a out/resumo_catalogo.txt
          python3 $P catalogo --zip dados/2022_2t_TO.zip --data 2022-10-30 --saida out/catalogo_2022_2t_TO.csv | tee -a out/resumo_catalogo.txt
          python3 $P amostra --zip dados/2026_1t_TO.zip --logs 2 --linhas 400 --data 2026-10-04 > out/amostra_2026_1t_TO.txt
      - name: Configuracao do Portal Resultados
        run: |
          curl -sS -m 120 "https://resultados.tse.jus.br/oficial/comum/config/ele-c.json" -o out/ele-c.json -w "ele-c http=%{http_code}\n" | tee -a out/downloads.txt || true
      - name: Publica saidas
        if: always()
        run: |
          cd out
          git init -q -b saidas-actions
          git config user.name "opianista-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Etapa 1 inspecao (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" saidas-actions
