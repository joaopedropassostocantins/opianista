name: Estudo 05 - placebos sintéticos e pré-registro
on:
  push:
    paths:
      - 'estudos/05_simulacao_temporal/**'
      - 'protocolos/04_estudo05_preregistro_v1_20261029.md'
      - '.github/workflows/placebo.yml'
  pull_request:
    paths:
      - 'estudos/05_simulacao_temporal/**'
      - 'protocolos/04_estudo05_preregistro_v1_20261029.md'
      - '.github/workflows/placebo.yml'
permissions:
  contents: read
jobs:
  no-target-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Registro criptográfico do pré-registro
        run: sha256sum protocolos/04_estudo05_preregistro_v1_20261029.md
      - name: Testes locais e bloqueios do pipeline
        run: python -m unittest discover -s estudos/05_simulacao_temporal -p 'test_pipeline_placebo.py' -v
      - name: Verificação de sintaxe Python
        run: python -m py_compile estudos/05_simulacao_temporal/pipeline_placebo.py
