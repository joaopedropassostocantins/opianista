name: Erro em dado ou codigo
description: Relatar erro em fonte, dado, parser, analise ou texto
title: "[Erro] "
labels: ["erro"]
body:
  - type: input
    id: local
    attributes:
      label: Arquivo ou etapa
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: Descricao do erro
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Saida, trecho do dado ou fonte que demonstra o erro. Nao inclua dados pessoais.
    validations:
      required: true
  - type: textarea
    id: correcao
    attributes:
      label: Correcao sugerida
